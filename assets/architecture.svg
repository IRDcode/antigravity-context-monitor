    <text x="68" y="39" class="sans" font-size="17" font-weight="700" fill="#E4E4E7">PASSIVE LOG ANALYZER</text>
    <text x="26" y="66" class="mono" font-size="12" fill="#63636B">Read-only transcript.jsonl</text>
    <line x1="26" y1="88" x2="442" y2="88" stroke="#161619" stroke-width="1"/>
    <rect x="26" y="139" width="4" height="4" fill="#71717A"/><text x="42" y="148" class="sans" font-size="15.5" fill="#D4D4D8">Reads live PLANNER_RESPONSE token counts</text><rect x="26" y="173" width="4" height="4" fill="#71717A"/><text x="42" y="182" class="sans" font-size="15.5" fill="#D4D4D8">36+ models + auto-discovery + custom caps</text><rect x="26" y="207" width="4" height="4" fill="#71717A"/><text x="42" y="216" class="sans" font-size="15.5" fill="#D4D4D8">Tracks CHECKPOINT compacts &amp; step rewinds</text><rect x="26" y="241" width="4" height="4" fill="#71717A"/><text x="42" y="250" class="sans" font-size="15.5" fill="#D4D4D8">Reconciles 7 categories &amp; child subagents</text>
  </g>
  <g transform="translate(566, 98)">
    <rect width="468" height="284" rx="12" fill="url(#surfaceGrad)" stroke="#1E1E22" stroke-width="1"/>
    <text x="26" y="40" class="mono" font-size="22" font-weight="700" fill="#F5F5F5">02</text>
    <text x="68" y="39" class="sans" font-size="17" font-weight="700" fill="#E4E4E7">UNIFIED DUAL UI</text>
    <text x="26" y="66" class="mono" font-size="12" fill="#63636B">Titlebar Alt+C + Sidecar AUX_PANE</text>
    <line x1="26" y1="88" x2="442" y2="88" stroke="#161619" stroke-width="1"/>
    <rect x="26" y="139" width="4" height="4" fill="#71717A"/><text x="42" y="148" class="sans" font-size="15.5" fill="#D4D4D8">Shared UI kit with custom ARIA combobox</text><rect x="26" y="173" width="4" height="4" fill="#71717A"/><text x="42" y="182" class="sans" font-size="15.5" fill="#D4D4D8">Native Light &amp; Dark theme synchronization</text><rect x="26" y="207" width="4" height="4" fill="#71717A"/><text x="42" y="216" class="sans" font-size="15.5" fill="#D4D4D8">Triple-marker meter + compaction alerts</text><rect x="26" y="241" width="4" height="4" fill="#71717A"/><text x="42" y="250" class="sans" font-size="15.5" fill="#D4D4D8">Clean New Session &amp; SPA route tracking</text>
  </g>
  <g transform="translate(1068, 98)">
    <rect width="468" height="284" rx="12" fill="url(#surfaceGrad)" stroke="#1E1E22" stroke-width="1"/>
    <text x="26" y="40" class="mono" font-size="22" font-weight="700" fill="#F5F5F5">03</text>
    <text x="68" y="39" class="sans" font-size="17" font-weight="700" fill="#E4E4E7">SAFE ASAR LIFECYCLE</text>
    <text x="26" y="66" class="mono" font-size="12" fill="#63636B">v2.34.0 Multi-Anchor + SHA-256</text>
    <line x1="26" y1="88" x2="442" y2="88" stroke="#161619" stroke-width="1"/>
    <rect x="26" y="139" width="4" height="4" fill="#71717A"/><text x="42" y="148" class="sans" font-size="15.5" fill="#D4D4D8">Matches loadHubWindowUrl &amp; legacy hooks</text><rect x="26" y="173" width="4" height="4" fill="#71717A"/><text x="42" y="182" class="sans" font-size="15.5" fill="#D4D4D8">SHA-256 auto-upgrade via --if-needed</text><rect x="26" y="207" width="4" height="4" fill="#71717A"/><text x="42" y="216" class="sans" font-size="15.5" fill="#D4D4D8">Strict 127.0.0.1 origin &amp; WeakSet guards</text><rect x="26" y="241" width="4" height="4" fill="#71717A"/><text x="42" y="250" class="sans" font-size="15.5" fill="#D4D4D8">Byte-identical .bak or self-heal restore</text>
  </g>

  <line x1="64" y1="404" x2="1536" y2="404" stroke="#161616" stroke-width="1"/>
  <text x="68" y="428" class="mono" font-size="12" letter-spacing="1.6" fill="#63636B">ZERO NETWORK REQUESTS  ·  SANITIZED ~/.antigravity-context-monitor.json  ·  SHARED CONTEXT-CORE V2.0</text>
