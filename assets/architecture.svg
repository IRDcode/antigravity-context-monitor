<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-label="Three-stage Antigravity Context Monitor architecture diagram">
  <style>

    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .rtl  { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; direction: rtl; unicode-bidi: embed; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ltr  { direction: ltr; unicode-bidi: embed; }
  </style>
  
  <defs>
    <clipPath id="frameClip">
      <rect x="1" y="1" width="1598" height="438" rx="22"/>
    </clipPath>
    <linearGradient id="surfaceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0D10"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="glassSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="0.7" cy="0.7" r="0.55" fill="#FFFFFF" opacity="0.045"/>
      <circle cx="2.2" cy="2.4" r="0.45" fill="#FFFFFF" opacity="0.03"/>
    </pattern>
  </defs>
  
  <g clip-path="url(#frameClip)">
    <rect width="1600" height="440" fill="#050505"/>
    <rect width="1600" height="440" fill="url(#grain)"/>
    <rect x="46" y="1.5" width="1508" height="1" fill="#FFFFFF" opacity="0.10"/>

    <!-- Minimal cinema glass sweep (matches profile theme) -->
    <g>
      <rect x="-340" y="-80" width="320" height="600" fill="url(#glassSweep)" transform="rotate(8)"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;2120 0;2120 0" keyTimes="0;0.18;1" dur="16s" repeatCount="indefinite"/>
    </g>

    <!-- Viewfinder corner ticks -->
    <g stroke="#5A5A5A" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M 26 42 V 30 Q 26 26 30 26 H 42"/>
      <path d="M 1558 26 H 1570 Q 1574 26 1574 30 V 42"/>
      <path d="M 26 398 V 410 Q 26 414 30 414 H 42"/>
      <path d="M 1558 414 H 1570 Q 1574 414 1574 410 V 398"/>
    </g>

    <text x="64" y="52" class="mono" font-size="12.5" letter-spacing="3.0" fill="#8A8A8A">SYSTEM ARCHITECTURE · PASSIVE TELEMETRY</text>
    <text x="1536" y="52" text-anchor="end" class="mono" font-size="12" letter-spacing="2.4" fill="#555555">VM VERIFIED · ACCOUNT SAFE</text>
    <line x1="64" y1="74" x2="1536" y2="74" stroke="#161616" stroke-width="1"/>
  </g>
  <rect x="1" y="1" width="1598" height="438" rx="22" fill="none" stroke="#1B1B1B" stroke-width="1.2"/>

  <line x1="532" y1="240" x2="566" y2="240" stroke="#3F3F46" stroke-width="1.5"/>
  <line x1="1034" y1="240" x2="1068" y2="240" stroke="#3F3F46" stroke-width="1.5"/>
  <rect x="532" y="238" width="6" height="4" rx="1" fill="#F5F5F5">
    <animate attributeName="x" values="532;560;532" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="1034" y="238" width="6" height="4" rx="1" fill="#F5F5F5">
    <animate attributeName="x" values="1034;1062;1034" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
  
  <g transform="translate(64, 98)">
    <rect width="468" height="284" rx="12" fill="url(#surfaceGrad)" stroke="#1E1E22" stroke-width="1"/>
    <text x="26" y="40" class="mono" font-size="22" font-weight="700" fill="#F5F5F5">01</text>
    <text x="68" y="39" class="sans" font-size="17" font-weight="700" fill="#E4E4E7">PASSIVE LOG ANALYZER</text>
    <text x="26" y="66" class="mono" font-size="12" fill="#63636B">Read-only transcript.jsonl</text>
    <line x1="26" y1="88" x2="442" y2="88" stroke="#161619" stroke-width="1"/>
    <rect x="26" y="139" width="4" height="4" fill="#71717A"/><text x="42" y="148" class="sans" font-size="15.5" fill="#D4D4D8">Reads local PLANNER_RESPONSE counts</text><rect x="26" y="173" width="4" height="4" fill="#71717A"/><text x="42" y="182" class="sans" font-size="15.5" fill="#D4D4D8">Matches 18 models + 128k/200k/1M caps</text><rect x="26" y="207" width="4" height="4" fill="#71717A"/><text x="42" y="216" class="sans" font-size="15.5" fill="#D4D4D8">Reconciles 7 categories to exact total</text><rect x="26" y="241" width="4" height="4" fill="#71717A"/><text x="42" y="250" class="sans" font-size="15.5" fill="#D4D4D8">Isolates child invoke_subagent sessions</text>
  </g>
  <g transform="translate(566, 98)">
    <rect width="468" height="284" rx="12" fill="url(#surfaceGrad)" stroke="#1E1E22" stroke-width="1"/>
    <text x="26" y="40" class="mono" font-size="22" font-weight="700" fill="#F5F5F5">02</text>
    <text x="68" y="39" class="sans" font-size="17" font-weight="700" fill="#E4E4E7">DUAL UI SURFACES</text>
    <text x="26" y="66" class="mono" font-size="12" fill="#63636B">Titlebar + Sidecar Extension</text>
    <line x1="26" y1="88" x2="442" y2="88" stroke="#161619" stroke-width="1"/>
    <rect x="26" y="139" width="4" height="4" fill="#71717A"/><text x="42" y="148" class="sans" font-size="15.5" fill="#D4D4D8">Native toolbar pill + Alt+C popover</text><rect x="26" y="173" width="4" height="4" fill="#71717A"/><text x="42" y="182" class="sans" font-size="15.5" fill="#D4D4D8">Official Sidecar AUX_PANE plugin</text><rect x="26" y="207" width="4" height="4" fill="#71717A"/><text x="42" y="216" class="sans" font-size="15.5" fill="#D4D4D8">Strict 127.0.0.1 origin enforcement</text><rect x="26" y="241" width="4" height="4" fill="#71717A"/><text x="42" y="250" class="sans" font-size="15.5" fill="#D4D4D8">Cross-model handoff overflow matrix</text>
  </g>
  <g transform="translate(1068, 98)">
    <rect width="468" height="284" rx="12" fill="url(#surfaceGrad)" stroke="#1E1E22" stroke-width="1"/>
    <text x="26" y="40" class="mono" font-size="22" font-weight="700" fill="#F5F5F5">03</text>
    <text x="68" y="39" class="sans" font-size="17" font-weight="700" fill="#E4E4E7">SAFE ASAR LIFECYCLE</text>
    <text x="26" y="66" class="mono" font-size="12" fill="#63636B">Atomic .bak + Auto-Repatch</text>
    <line x1="26" y1="88" x2="442" y2="88" stroke="#161619" stroke-width="1"/>
    <rect x="26" y="139" width="4" height="4" fill="#71717A"/><text x="42" y="148" class="sans" font-size="15.5" fill="#D4D4D8">Pre-validates loadURL hook before .bak</text><rect x="26" y="173" width="4" height="4" fill="#71717A"/><text x="42" y="182" class="sans" font-size="15.5" fill="#D4D4D8">VM syntax verification pre-pack</text><rect x="26" y="207" width="4" height="4" fill="#71717A"/><text x="42" y="216" class="sans" font-size="15.5" fill="#D4D4D8">Preserves sibling app.asar.unpacked</text><rect x="26" y="241" width="4" height="4" fill="#71717A"/><text x="42" y="250" class="sans" font-size="15.5" fill="#D4D4D8">One-click restore via .bak or strip</text>
  </g>

  <line x1="64" y1="404" x2="1536" y2="404" stroke="#161616" stroke-width="1"/>
  <text x="68" y="428" class="mono" font-size="12" letter-spacing="1.6" fill="#63636B">ZERO NETWORK REQUESTS  ·  SANITIZED ~/.antigravity-context-monitor.json  ·  SHARED CONTEXT-CORE</text>
</svg>