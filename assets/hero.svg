<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-label="Antigravity Context Monitor — Real-time session token telemetry and model ceiling guard">
  <style>

    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .rtl  { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; direction: rtl; unicode-bidi: embed; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ltr  { direction: ltr; unicode-bidi: embed; }
  </style>
  
  <defs>
    <clipPath id="frameClip">
      <rect x="1" y="1" width="1598" height="478" rx="22"/>
    </clipPath>
    <linearGradient id="surfaceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0D10"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="glassSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="0.7" cy="0.7" r="0.55" fill="#FFFFFF" opacity="0.045"/>
      <circle cx="2.2" cy="2.4" r="0.45" fill="#FFFFFF" opacity="0.03"/>
    </pattern>
  </defs>
  
  <g clip-path="url(#frameClip)">
    <rect width="1600" height="480" fill="#050505"/>
    <rect width="1600" height="480" fill="url(#grain)"/>
    <rect x="46" y="1.5" width="1508" height="1" fill="#FFFFFF" opacity="0.10"/>

    <!-- Minimal cinema glass sweep (matches profile theme) -->
    <g>
      <rect x="-340" y="-80" width="320" height="640" fill="url(#glassSweep)" transform="rotate(8)"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;2120 0;2120 0" keyTimes="0;0.18;1" dur="16s" repeatCount="indefinite"/>
    </g>

    <!-- Viewfinder corner ticks -->
    <g stroke="#5A5A5A" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M 26 42 V 30 Q 26 26 30 26 H 42"/>
      <path d="M 1558 26 H 1570 Q 1574 26 1574 30 V 42"/>
      <path d="M 26 438 V 450 Q 26 454 30 454 H 42"/>
      <path d="M 1558 454 H 1570 Q 1574 454 1574 450 V 438"/>
    </g>

    <text x="64" y="52" class="mono" font-size="12.5" letter-spacing="3.0" fill="#8A8A8A">IRDCODE · ANTIGRAVITY-CONTEXT-MONITOR</text>
    <text x="1536" y="52" text-anchor="end" class="mono" font-size="12" letter-spacing="2.4" fill="#555555">V1.0 · TITLEBAR + SIDECAR</text>
    <line x1="64" y1="74" x2="1536" y2="74" stroke="#161616" stroke-width="1"/>
  </g>
  <rect x="1" y="1" width="1598" height="478" rx="22" fill="none" stroke="#1B1B1B" stroke-width="1.2"/>

  <g>
    <text x="68" y="168" class="sans" font-size="66" font-weight="750" letter-spacing="-1.6" fill="#F5F5F5">Antigravity</text>
    <text x="68" y="242" class="sans" font-size="64" font-weight="750" letter-spacing="-1.6" fill="#9A9A9A">Context Monitor</text>
    <line x1="68" y1="274" x2="148" y2="274" stroke="#444444" stroke-width="2"/>
    <text x="68" y="314" class="sans" font-size="20" font-weight="400" fill="#BDBDBD">Ground-truth session window, 7-category breakdown &amp; model ceiling guard</text>
    <text x="68" y="356" class="mono" font-size="14" letter-spacing="0.4" fill="#6E6E6E">128k GPT-OSS  ·  200k Claude 5.5  ·  1M Gemini / Orchestrator</text>
  </g>

  <!-- Right monochrome telemetry card -->
  <g transform="translate(868, 102)">
    <rect width="664" height="284" rx="14" fill="url(#surfaceGrad)" stroke="#1E1E22" stroke-width="1"/>
    <circle cx="28" cy="30" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="42" y="34" class="mono" font-size="11.5" letter-spacing="1.8" fill="#777777">SESSION TELEMETRY · ORCHESTRATOR (EXEC)</text>
    <text x="640" y="34" text-anchor="end" class="mono" font-size="11.5" fill="#10B981">SAFE · 24.5%</text>
    <line x1="24" y1="50" x2="640" y2="50" stroke="#161619" stroke-width="1"/>

    <g transform="translate(24, 68)">
      <text x="0" y="24" class="mono" font-size="28" font-weight="700" fill="#F5F5F5">245.3k</text>
      <text x="128" y="24" class="mono" font-size="15" fill="#737373">/ 1.0M tokens</text>
      <text x="616" y="24" text-anchor="end" class="mono" font-size="12" fill="#A1A1AA">CACHE HIT 98.7%</text>

      <rect x="0" y="42" width="616" height="10" rx="5" fill="#141417"/>
      <rect x="0" y="42" width="150" height="10" rx="5" fill="#EAEAEA">
        <animate attributeName="width" values="134;176;134" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="92" y="40" width="2" height="14" fill="#F59E0B"/>
    </g>

    <g transform="translate(24, 146)">
      <rect width="198" height="48" rx="8" fill="#0B0B0D" stroke="#2D2D33"/>
      <text x="14" y="20" class="mono" font-size="10.5" fill="#737373">128k GPT-OSS</text>
      <text x="14" y="38" class="mono" font-size="13" font-weight="700" fill="#EF4444">191.6% · OVER</text>

      <rect x="209" width="198" height="48" rx="8" fill="#0B0B0D" stroke="#2D2D33"/>
      <text x="223" y="20" class="mono" font-size="10.5" fill="#737373">200k CLAUDE 5.5</text>
      <text x="223" y="38" class="mono" font-size="13" font-weight="700" fill="#EF4444">122.7% · OVER</text>

      <rect x="418" width="198" height="48" rx="8" fill="#111114" stroke="#2A2A30"/>
      <text x="432" y="20" class="mono" font-size="10.5" fill="#737373">1M GEMINI</text>
      <text x="432" y="38" class="mono" font-size="13" font-weight="700" fill="#10B981">24.5% · SAFE</text>
    </g>

    <g transform="translate(24, 214)">
      <rect width="616" height="48" rx="8" fill="#08080A" stroke="#1B1B20"/>
      <text x="16" y="29" class="mono" font-size="12" fill="#A1A1AA">FILES 34%  ·  SKILLS 27%  ·  TERM 19%  ·  REASON 9%  ·  SYS 8%  ·  MCP 2%</text>
    </g>
  </g>

  <line x1="64" y1="412" x2="1536" y2="412" stroke="#161616" stroke-width="1"/>
  <text x="68" y="446" class="mono" font-size="12.5" letter-spacing="1.8" fill="#63636B">18 OFFICIAL MODELS  ·  ZERO NETWORK CALLS  ·  ISOLATED SUBAGENTS  ·  TITLEBAR + SIDECAR  ·  ALT+C</text>
</svg>